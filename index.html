<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAMS-SMART | Smart Home</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section id="intro">

        <div class="room">
            <div class="room-content">
                <div class="logo">SAMS-SMART</div>
                <p>SMART HOME TECHNOLOGY</p>
            </div>
        </div>

        <div class="curtain curtain-left"></div>
        <div class="curtain curtain-right"></div>

        <div class="power-container">

            <button id="powerButton">
                <span>⏻</span>
            </button>

            <div class="power-text">
                <strong>POWER ON</strong>
                <span>Tap to enter</span>
            </div>

        </div>

    </section>


    <main id="website">

        <header>

            <div class="nav-logo">
                SAMS-SMART
            </div>

            <nav>
                <a href="#">Home</a>
                <a href="#">Solutions</a>
                <a href="#">Projects</a>
                <a href="#">About</a>
                <a href="#">Contact</a>
            </nav>

        </header>


        <section class="hero">

            <div class="hero-content">

                <span>SMART HOME AUTOMATION</span>

                <h1>
                    Your Home.<br>
                    <strong>Your Intelligence.</strong>
                </h1>

                <p>
                    Transform your home into a smarter,
                    safer and more comfortable living experience.
                </p>

                <button class="discover">
                    Discover Smart Living
                </button>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
